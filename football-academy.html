<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Academy Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EE;--surface:#FFFFFF;--ink:#16211A;--muted:#5B6A5F;--line:#D5DDD1;--chip:#E4EBE1;
  --pitch:#1D6A3A;--pitch-2:#195E33;--on-pitch:#F4FAF5;--bib:#D9581A;
  --present:#1D8A45;--late:#A87B07;--absent:#C2412F;--excused:#5E7189;
  --radius-s:8px;--radius-m:14px;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1611;--surface:#17211A;--ink:#E6EEE7;--muted:#97A69A;--line:#2A382E;--chip:#223026;
    --pitch:#1B5E35;--pitch-2:#17532F;--on-pitch:#EEF7F0;--bib:#F0844A;
    --present:#3BAA63;--late:#D3A22B;--absent:#E06552;--excused:#8A9DB5;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1611;--surface:#17211A;--ink:#E6EEE7;--muted:#97A69A;--line:#2A382E;--chip:#223026;
  --pitch:#1B5E35;--pitch-2:#17532F;--on-pitch:#EEF7F0;--bib:#F0844A;
  --present:#3BAA63;--late:#D3A22B;--absent:#E06552;--excused:#8A9DB5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bib);outline-offset:2px}

/* Header: a mown pitch */
.top{
  background:repeating-linear-gradient(90deg,var(--pitch) 0 44px,var(--pitch-2) 44px 88px);
  color:var(--on-pitch);position:relative;overflow:hidden;
}
.top-inner{max-width:760px;margin:0 auto;padding:18px 16px 20px;display:flex;align-items:flex-end;gap:12px;position:relative;z-index:1}
.top h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;margin:0;letter-spacing:.01em}
.top p{margin:4px 0 0;opacity:.85;font-size:.95rem}
.top .grow{flex:1;min-width:0}
.chalk{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:220px;height:220px;opacity:.28;pointer-events:none}
.icon-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:var(--on-pitch);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.24)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h2{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.1;margin:28px 0 10px}
h2:first-child{margin-top:4px}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--absent)}
.btn.slim{padding:6px 12px;min-height:36px;font-size:.92rem}
.link{background:none;border:0;padding:6px 0;color:var(--pitch);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--present)}}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-weight:700}
.stat span{font-size:.85rem;color:var(--muted)}

/* Session row */
.srow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.srow:hover{background:var(--chip)}
.sdate{width:46px;flex:none;text-align:center;border-right:2px solid var(--line);padding-right:12px}
.sdate b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1}
.sdate small{color:var(--muted);font-size:.8rem}
.sbody{flex:1;min-width:0}
.stitle{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{display:block;color:var(--muted);font-size:.88rem}
.satt{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);vertical-align:middle}
.tag.match{background:var(--bib);color:#fff}

/* Player row */
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 14px}
.prow:hover{background:var(--chip)}
.shirt{width:42px;height:42px;flex:none;border-radius:10px 10px 14px 14px;background:var(--pitch);color:var(--on-pitch);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.shirt.off{background:var(--chip);color:var(--muted)}
.pname{display:block;font-weight:600}
.pmeta{display:block;color:var(--muted);font-size:.88rem}
.pright{margin-left:auto;text-align:right;font-size:.88rem;color:var(--muted);flex:none}
.pright b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.low{color:var(--absent)!important}

/* Attendance */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:8px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"shirt name note" "seg seg seg";align-items:center;gap:10px 12px;padding:12px 14px}
.arow > .shirt{grid-area:shirt}.arow > .aname{grid-area:name}.arow > .nbtn{grid-area:note}.arow > .seg{grid-area:seg}
.arow .pname{display:block;white-space:normal;overflow:visible;overflow-wrap:break-word;line-height:1.25}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg button{border:0;background:var(--surface);height:42px;padding:0 4px;font-weight:600;font-size:.88rem;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:700px){.arow{grid-template-columns:auto minmax(0,1fr) auto 340px;grid-template-areas:"shirt name note seg"}}
@media (max-width:400px){.seg button{font-size:.8rem;padding:0 2px;letter-spacing:-.01em}.arow{padding:12px 12px}}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{color:#fff}
.seg .present[aria-pressed="true"]{background:var(--present)}
.seg .late[aria-pressed="true"]{background:var(--late)}
.seg .absent[aria-pressed="true"]{background:var(--absent)}
.seg .excused[aria-pressed="true"]{background:var(--excused)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chip);margin:10px 0 6px}
.bar span{display:block;height:100%}
.st{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}
.st.present{background:var(--present)}.st.late{background:var(--late)}.st.absent{background:var(--absent)}.st.excused{background:var(--excused)}

/* Player hero */
.phero{display:flex;gap:16px;align-items:center}
.phero .shirt{width:76px;height:76px;font-size:2.3rem;border-radius:16px 16px 24px 24px}
.phero h2{margin:0;font-size:1.9rem}
.radar-wrap{display:flex;justify-content:center}
.radar-wrap svg{width:100%;max-width:340px;height:auto}
.skill{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;padding:6px 0;font-size:.93rem}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:8px;border-radius:2px;background:var(--chip)}
.pips i.on{background:var(--pitch)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pips i.on{background:var(--present)}}
.delta{font-family:var(--display);font-weight:600;text-align:right}
.up{color:var(--present)}.down{color:var(--absent)}
.item{padding:12px 14px}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:22px 18px}
.welcome h2{margin-top:0}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 0;font-weight:600;color:var(--muted);margin-bottom:6px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);margin-bottom:10px}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pitch)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:var(--present)}}

/* Dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 20px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,20,12,.5)}
dialog form{padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
dialog h2{margin:0 0 4px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg);width:100%}
label.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.slider span{font-weight:600;font-size:.92rem}
.slider output{font-size:.85rem;color:var(--muted);text-align:right;min-width:92px}
.slider input{grid-column:1 / -1;width:100%;accent-color:var(--pitch)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}


/* View switch */
.switch{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:10px;padding:3px;margin:0 0 14px}
.switch button{border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;font-size:.92rem;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.navrow{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.navrow .lbl{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:1.25rem}
.navbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1}
.day{margin:0 0 12px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-weight:600}
.dayhead .now{background:var(--bib);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:999px}
.rest{padding:10px 14px;color:var(--muted);font-size:.92rem;border:1px dashed var(--line);border-radius:var(--radius-m)}
.tag.plan{background:transparent;border:1px solid var(--line);color:var(--muted)}
.reason{display:block;font-size:.82rem;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{background:none;border:0;padding:0;color:var(--muted);font-size:.82rem;text-decoration:underline}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;inset:0}
.daypick span{display:block;padding:8px 11px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.9rem}
.daypick input:checked + span{background:var(--pitch);color:var(--on-pitch)}
.daypick input:focus-visible + span{outline:3px solid var(--bib);outline-offset:2px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
/* Register */
.reg-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
.reg{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:100%}
.reg th,.reg td{padding:0;text-align:center;border-bottom:1px solid var(--line);height:40px}
.reg thead th{font-weight:600;color:var(--muted);font-size:.78rem;line-height:1.1;padding:6px 2px;min-width:38px}
.reg thead th b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.reg .nm{position:sticky;left:0;background:var(--surface);text-align:left;padding:0 10px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-right:1px solid var(--line);z-index:1}
.reg .pct{font-family:var(--display);font-weight:700;font-size:1rem;padding:0 10px;border-left:1px solid var(--line)}
.reg tr:last-child td{border-bottom:0}
.cell{width:32px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted)}
.cell.present{background:var(--present);border-color:var(--present);color:#fff}
.cell.late{background:var(--late);border-color:var(--late);color:#fff}
.cell.absent{background:var(--absent);border-color:var(--absent);color:#fff}
.cell.excused{background:var(--excused);border-color:var(--excused);color:#fff}
.na{color:var(--line)}
.months{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.75rem;color:var(--muted);gap:3px}
.months i{display:block;width:100%;max-width:34px;background:var(--pitch);border-radius:4px 4px 0 0;min-height:2px}
.months i.none{background:var(--chip)}

/* Schedule */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.weeknav b{font-family:var(--display);font-size:1.2rem}
.round{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:1.3rem;line-height:1}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 2px;font-family:var(--display);font-weight:600;font-size:1.08rem}
.dayhead.today{color:var(--bib)}
.dayempty{padding:2px 14px 12px;color:var(--muted);font-size:.88rem}
.day > .srow{padding-top:8px}
.cancelled .stitle{text-decoration:line-through;color:var(--muted)}
.cancelled .sdate b{color:var(--muted)}
.mark{color:var(--bib);font-family:var(--body);font-size:.85rem;font-weight:700}
.banner{background:var(--chip);border-left:4px solid var(--bib);border-radius:var(--radius-s);padding:12px 14px;margin-top:12px}
.dayset{display:flex;gap:6px;flex-wrap:wrap}
.dayset label{position:relative}
.dayset input{position:absolute;opacity:0;width:1px;height:1px}
.dayset span{display:inline-block;padding:8px 12px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.92rem;cursor:pointer}
.dayset input:checked + span{background:var(--pitch);color:var(--on-pitch)}
.dayset input:focus-visible + span{outline:3px solid var(--bib);outline-offset:2px}
/* Attendance reports */
.nbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);width:36px;height:40px;color:var(--muted);flex:none;display:grid;place-items:center}
.nbtn.has{color:var(--bib);border-color:var(--bib)}
.anote{display:block;font-size:.82rem;color:var(--muted);white-space:normal;overflow-wrap:break-word}
.aname{flex:1;min-width:0}
.aname .pname{white-space:normal}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.reg{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
.reg table{border-collapse:separate;border-spacing:0;font-size:.85rem;min-width:100%}
.reg th,.reg td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line);min-width:32px}
.reg tr:last-child td{border-bottom:0}
.reg th{font-weight:600;color:var(--muted);line-height:1.1}
.reg th b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.reg th:first-child,.reg td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;padding-left:12px;min-width:118px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;border-right:1px solid var(--line)}
.reg td:last-child,.reg th:last-child{padding-right:12px;font-weight:600}
.cell{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--display);font-weight:700;color:#fff;font-size:.95rem}
.cell.present{background:var(--present)}.cell.late{background:var(--late)}.cell.absent{background:var(--absent)}.cell.excused{background:var(--excused)}
.cell.none{background:var(--chip)}
.trend{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.trend > div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.trend i{display:block;width:100%;max-width:46px;background:var(--pitch);border-radius:6px 6px 2px 2px;min-height:2px}
.trend b{font-family:var(--display);color:var(--ink);font-size:1rem}
.counts{font-size:.8rem;color:var(--muted);display:block}
@media (max-width:420px){.tab{font-size:.68rem}.tab svg{width:22px;height:22px}}
.prow .pright.row .btn.slim{padding:6px 10px}
/* Home dashboard */
.tickets{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.ticket{display:flex;width:100%;text-align:left;padding:0;border:0;background:var(--surface);color:var(--ink);border-radius:18px;position:relative;overflow:hidden;box-shadow:0 1px 0 var(--line),0 14px 30px -18px rgba(18,70,38,.55)}
.ticket-main{flex:1;min-width:0;padding:16px 16px 18px 20px;display:flex;flex-direction:column;border-left:6px solid var(--pitch)}
.t-label{font-weight:600;font-size:.88rem;color:var(--bib)}
.t-time{font-family:var(--display);font-weight:700;font-size:3rem;line-height:.95;margin-top:4px;letter-spacing:.005em}
.t-title{font-weight:600;font-size:1.05rem;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{color:var(--muted);font-size:.9rem}
.ticket-stub{width:112px;flex:none;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 8px;position:relative;text-align:center}
.ticket-stub::before,.ticket-stub::after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket-stub::before{top:-11px}.ticket-stub::after{bottom:-11px}
.ringbox{position:relative;width:76px;height:76px;display:block}
.ring-n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.35rem}
.ring-n small{font-size:.85rem;color:var(--muted)}
.stub-big{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1}
.stub-l{font-size:.8rem;color:var(--muted)}

.itrow > input{font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.steps-ol{margin:8px 0 10px;padding-left:20px;font-size:.9rem;color:var(--muted)}
.steps-ol li{margin:2px 0}
.invite summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--pitch)}
.invite pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:.88rem;background:var(--chip);border-radius:var(--radius-s);padding:10px 12px;margin:8px 0 0}
/* Events */
.evcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--bib);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px}
.evcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.evhero,.evban{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-radius:16px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,var(--bib),#a8400f)}
.evhero b,.evban b{font-family:var(--display);font-size:1.8rem;line-height:1.05}
.evhero-l,.evban-l{font-size:.82rem;font-weight:700;opacity:.9}
.evban{margin:16px 0 0}
.evstep{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.evstep > span:nth-child(2){flex:1;display:flex;flex-direction:column}
.tm{display:inline-flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.tm i{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tm-big{font-family:var(--display);font-size:1.25rem}.tm-big i{width:16px;height:16px}
.tm-tbd{color:var(--muted);font-weight:500}
.mc-list{display:flex;flex-direction:column;gap:8px}
.mc{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px}
.mc[aria-disabled="true"]{opacity:.75}
.mc.done{border-left:4px solid var(--present)}
.mc-bye{font-size:.9rem;color:var(--muted)}
.mc-meta{font-size:.78rem;color:var(--muted);font-weight:600}
.mc-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mc-row .mc-team:last-child{justify-self:end;text-align:right}
.mc-team.tbd{font-size:.85rem;color:var(--muted)}
.mc-team.win .tm{text-decoration:underline;text-decoration-color:var(--present);text-decoration-thickness:3px;text-underline-offset:4px}
.mc-score{font-family:var(--display);font-weight:700;font-size:1.5rem;min-width:58px;text-align:center;color:var(--ink)}
.mc-score small{margin:0 3px;color:var(--muted)}
.mc-pens,.mc-goals{font-size:.8rem;color:var(--muted)}
.lt td:first-child{min-width:150px}
.lt tr.qual td:first-child{box-shadow:inset 3px 0 0 var(--present)}
.pos{display:inline-block;width:20px;color:var(--muted);font-weight:700;font-family:var(--display)}
.bracket{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.br-col{min-width:250px;display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.br-h{font-family:var(--display);font-weight:700;font-size:1rem}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.teamcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-top:5px solid var(--tc);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px}
.teamcard-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.teamcard-p{display:flex;flex-wrap:wrap;gap:4px}
.teamcard-p span{font-size:.82rem;background:var(--chip);border-radius:999px;padding:2px 8px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aw{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.aw > span{font-size:.82rem;color:var(--muted);font-weight:600}
.aw b small{color:var(--muted);font-weight:500}
.aw-gold{grid-column:1 / -1;background:linear-gradient(135deg,#fff7df,var(--surface));border-color:#e9c96b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aw-gold{background:linear-gradient(135deg,#3a3216,var(--surface));border-color:#7a6424}}
.scorebox{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.scorebox label{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.scorebox input{width:84px;text-align:center;font-family:var(--display);font-size:2rem;font-weight:700;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.scorebox > span{font-size:2rem;color:var(--muted);padding-bottom:8px}
.goalrow select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
/* Login page */
body.login-mode{background:#0A1611}
body.login-mode .top{display:none}
body.login-mode main{max-width:520px;padding:0}
.lg{--lgbg:#0A1611;--lgfield:#0F201A;--lgline:#1F3A2E;--lgtext:#F2F7F4;--lgmuted:#8FA69A;--lgacc:#2BD27E;
  position:relative;overflow:hidden;min-height:100vh;color:var(--lgtext);
  background:radial-gradient(120% 60% at 100% 0%,#12301F 0%,transparent 60%),var(--lgbg);
  padding:calc(28px + env(safe-area-inset-top,0px)) 26px 40px}
.lg-circle{position:absolute;right:-110px;top:-60px;width:330px;height:330px;fill:none;stroke:#1C3A2A;stroke-width:4;pointer-events:none}
.lg-circle .dot{fill:#1C3A2A;stroke:none}
.lg-top{position:relative;display:flex;align-items:center;gap:12px;margin:14px 0 60px}
.lg-top b{font-family:var(--display);font-weight:700;font-size:1.65rem;letter-spacing:.005em;flex:1;min-width:0;line-height:1.05;overflow-wrap:break-word}
@media (max-width:420px){.lg-portal{letter-spacing:.16em;font-size:.6rem}}
@media (max-width:350px){.lg-portal{display:none}}
.lg-logo{width:52px;height:52px;flex:none;border-radius:14px;background:#14512E;color:#F2F7F4;display:grid;place-items:center}
.lg-portal{position:absolute;right:0;top:-22px;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--lgmuted);font-weight:600;white-space:nowrap}
.lg-eyebrow{position:relative;margin:0 0 10px;color:var(--lgacc);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
.lg h1{position:relative;font-family:var(--body);font-weight:700;font-size:clamp(2.2rem,9.5vw,3rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px;max-width:12ch}
.lg-tag{position:relative;color:var(--lgmuted);font-size:1.05rem;margin:0 0 30px}
.lg-form{position:relative;display:flex;flex-direction:column}
.lg-l{font-weight:600;font-size:1rem;margin:0 0 8px;color:var(--lgtext)}
.lg-field{display:flex;align-items:center;gap:12px;background:var(--lgfield);border:1px solid var(--lgline);border-radius:12px;padding:0 14px 0 16px;margin-bottom:20px;color:var(--lgmuted);transition:border-color .15s}
.lg-field:focus-within{border-color:var(--lgacc);box-shadow:0 0 0 3px rgba(43,210,126,.18)}
.lg-field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--lgtext);font-size:1.05rem;padding:17px 0}
.lg-field input::placeholder{color:#6F8579}
.lg-eye{background:none;border:0;color:var(--lgmuted);padding:6px;display:grid;place-items:center;border-radius:8px}
.lg-eye:hover{color:var(--lgtext)}
.lg-check{display:flex;align-items:center;gap:12px;font-size:1rem;margin:2px 0 22px;cursor:pointer;color:var(--lgtext)}
.lg-check input{position:absolute;opacity:0;width:1px;height:1px}
.lg-check .box{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--lgline);display:grid;place-items:center;color:transparent;background:var(--lgfield)}
.lg-check input:checked + .box{background:var(--lgacc);border-color:var(--lgacc);color:#062114}
.lg-check input:focus-visible + .box{outline:3px solid var(--lgacc);outline-offset:2px}
.lg-err{margin:-6px 0 14px;color:#FF8A7A;font-size:.92rem}
.lg-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:12px;background:var(--lgacc);color:#062114;font-size:1.2rem;font-weight:700;padding:17px 18px;min-height:58px}
.lg-btn:hover{filter:brightness(1.06)}.lg-btn:disabled{opacity:.7}
.lg-bio{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;border:1px solid var(--lgline);border-radius:12px;background:transparent;color:var(--lgtext);font-weight:600;font-size:1rem;padding:14px 16px;min-height:52px}
.lg-bio:hover{border-color:var(--lgacc)}
.lg-bio svg{color:var(--lgacc)}
.lg-forgot{display:flex;flex-direction:column;gap:2px;margin-top:26px;font-size:1rem}
.lg-forgot span{color:var(--lgmuted)}
.lg-hr{border:0;border-top:1px solid var(--lgline);margin:22px 0 18px;width:100%}
.lg-owner{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;color:var(--lgacc);font-weight:600;font-size:1rem;text-align:left}
.lg :focus-visible{outline:3px solid var(--lgacc);outline-offset:2px}
.lg-field input:focus-visible{outline:none}
@media (min-width:600px){.lg{border-radius:0}}
.hdr-logo{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;object-fit:contain;padding:2px;box-shadow:0 2px 10px rgba(0,0,0,.25);align-self:center}
.top-inner{align-items:center}
.lg-logoimg{width:60px;height:60px;flex:none;border-radius:50%;background:#fff;object-fit:contain;padding:2px;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.logo-set{display:flex;gap:12px;align-items:center;background:var(--chip);border-radius:var(--radius-s);padding:10px 12px}
.logo-set img{width:64px;height:64px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.logo-set > div{display:flex;flex-direction:column;gap:2px}
.lg-tip{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:14px 16px;border-radius:12px;background:#0F2A1D;border:1px solid #1F4A33;color:var(--lgtext);font-size:.95rem}
.lg-tip span{color:#B9CEC2}.lg-tip .lg-tip-sub{font-size:.88rem;color:var(--lgmuted)}

const logoSrc=()=>settings.logo||DEFAULT_LOGO;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function parseISO(s){const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]||1)}
function addDays(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function weekStart(s){const d=parseISO(s);return addDays(s,-((d.getDay()+6)%7))}
function addMonths(m,n){const d=parseISO(m+"-01");d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)}
function monthEnd(m){return addDays(addMonths(m,1)+"-01",-1)}
const today=()=>iso(new Date());
function fmt(s,o){return s?parseISO(s).toLocaleDateString(undefined,o||{weekday:"short",day:"numeric",month:"short"}):""}
function fmtMonth(m,long){return parseISO(m+"-01").toLocaleDateString(undefined,{month:long?"long":"short",year:long?"numeric":undefined})}
function ageFrom(dob){if(!dob)return null;const d=parseISO(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
const timeRange=s=>s.time?(s.time+(s.endTime?"–"+s.endTime:"")):"";
const daysLabel=days=>WEEK_ORDER.filter(d=>(days||[]).includes(d)).map(d=>DAYN[d]).join(", ");

/* ---------- Store ---------- */
const COLS=["players","sessions","assessments","schedules","payments","charges","coaches","salaries","coachPrivate","coachLinks","programs","programTemplates","events","appUsers"];
const data={players:{},sessions:{},assessments:{},schedules:{},payments:{},charges:{},coaches:{},salaries:{},coachPrivate:{},coachLinks:{},programs:{},programTemplates:{},events:{},appUsers:{}};
let settings={name:"",groups:["U8","U10","U12","U14","U16"],currency:"MVR",dueDay:10,groupFees:{}};
let DB=null,DL=null,mode="loading",forceReady=false;const loaded=new Set();
const pending={};let pendTimer=null;
const ui={tab:"home",detail:null,group:"All",q:"",pastLimit:10,week:weekStart(today()),period:"month",regMonth:today().slice(0,7),sort:"low",feeMonth:today().slice(0,7),feeFilter:"all",people:"players",money:"fees",salMonth:today().slice(0,7),preview:null,schedMode:"calendar",progCoach:"all",progView:"plans",guideStage:null,evCat:null,evTab:"matches",evView:"comp"};

function ready(){return forceReady||mode==="local"||(mode==="cloud"&&loaded.size>=COLS.length+1&&VIEWER.known)}
function saveLocal(){try{const o={settings};COLS.forEach(c=>o[c]=data[c]);localStorage.setItem(LS_KEY,JSON.stringify(o))}catch(e){}}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(j){COLS.forEach(c=>data[c]=j[c]||{});if(j.settings)settings=Object.assign({},settings,j.settings)}}catch(e){}}

async function init(){
  $("#hdrDate").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  render();
  setTimeout(()=>{if(!ready()){forceReady=true;render()}},9000);
  const hasUse=window.claude&&typeof window.claude.use==="function";
  if(hasUse)window.claude.use("downloads").then(d=>{DL=d;render()}).catch(()=>{});
  let db=null;
  try{if(hasUse)db=await window.claude.use("db")}catch(e){db=null}
  if(db){
    DB=db;mode="cloud";
    COLS.forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
        if(col==="sessions")Object.keys(pending).forEach(k=>{o[k]=pending[k]});
        data[col]=o;loaded.add(col);render();
      },()=>toast("Lost connection to saved data. Reload the page."));
    });
    db.doc("settings/academy").onSnapshot(s=>{if(s.exists)settings=Object.assign({},settings,s.data());loaded.add("settings");render()},()=>{loaded.add("settings");render()});
  }else{mode="local";loadLocal();render()}
  initViewer();
}
function handleErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument")toast("You can view this academy but not change it.");
  else if(c==="quota_exceeded")toast("Storage is full. Delete old sessions to make room.");
  else toast("Couldn't save. Check your connection and try again.");
}
async function put(col,id,obj){
  data[col][id]=obj;render();
  if(mode==="cloud"){try{await DB.collection(col).doc(id).set(obj)}catch(e){handleErr(e)}}else saveLocal();
}
async function remove(col,id){
  delete data[col][id];render();
  if(mode==="cloud"){try{await DB.collection(col).doc(id).delete()}catch(e){handleErr(e)}}else saveLocal();
}
async function saveSettings(){
  render();
  if(mode==="cloud"){try{await DB.doc("settings/academy").set(clone(settings))}catch(e){handleErr(e)}}else saveLocal();
}
function sessionDoc(s){const o=clone(s);delete o.id;delete o.virtual;delete o.cancelled;o.attendance=o.attendance||{};if(!o.createdAt)o.createdAt=Date.now();return o}
function mutateSession(sid,fn,delay){
  const s=pending[sid]||sessionDoc(getSession(sid));
  fn(s);pending[sid]=s;data.sessions[sid]=s;render();
  clearTimeout(pendTimer);pendTimer=setTimeout(flush,delay||700);
}
function setAtt(sid,pid,status){mutateSession(sid,s=>{s.attendance=Object.assign({},s.attendance);if(status)s.attendance[pid]=status;else delete s.attendance[pid]})}
async function flush(){for(const sid of Object.keys(pending)){const s=pending[sid];delete pending[sid];await put("sessions",sid,s)}}
function setSkip(scId,date,on){
  const sc=clone(data.schedules[scId]);if(!sc)return;
  const sk=new Set(sc.skips||[]);on?sk.add(date):sk.delete(date);sc.skips=Array.from(sk).sort();
  put("schedules",scId,sc);
}

/* ---------- Derived ---------- */
const allPlayers=()=>Object.keys(data.players).map(id=>Object.assign({id},data.players[id]));
const players=()=>{const a=allPlayers(),S=scope();return S?a.filter(p=>S.groups.includes(p.group)):a};
const active=()=>players().filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
const inGroup=p=>ui.group==="All"||p.group===ui.group;
const sessGroupOk=s=>ui.group==="All"||s.group==="All"||s.group===ui.group;
const sessions=()=>{const a=Object.keys(data.sessions).map(id=>Object.assign({id},data.sessions[id])),S=scope();
  return S?a.filter(s=>S.groups.includes(s.group)||(s.group==="All"&&S.groups.length)||(s.coachIds||[]).includes(S.cid)):a};
const schedules=()=>{const a=Object.keys(data.schedules).map(id=>Object.assign({id},data.schedules[id])),S=scope();
  return S?a.filter(sc=>S.groups.includes(sc.group)||(sc.group==="All"&&S.groups.length)):a};
const byTime=(a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""));
function virtualOcc(sc,d,cancelled){return {id:sc.id+"_"+d,virtual:true,cancelled:!!cancelled,scheduleId:sc.id,date:d,time:sc.time||"",endTime:sc.endTime||"",group:sc.group,type:sc.type||"Training",focus:sc.focus||"",location:sc.location||"",notes:"",attendance:{}}}
function getSession(id){
  if(data.sessions[id])return Object.assign({id},data.sessions[id]);
  const i=id.lastIndexOf("_");if(i<0)return null;
  const scId=id.slice(0,i),d=id.slice(i+1),sc=data.schedules[scId];
  if(!sc||!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;
  return virtualOcc(Object.assign({id:scId},sc),d,(sc.skips||[]).includes(d));
}
function occurrences(from,to,withCancelled){
  const out=sessions().filter(s=>s.date>=from&&s.date<=to);
  schedules().forEach(sc=>{
    let d=sc.startDate&&sc.startDate>from?sc.startDate:from;
    const end=sc.endDate&&sc.endDate<to?sc.endDate:to;
    let guard=0;
    while(d<=end&&guard++<800){
      if((sc.days||[]).includes(parseISO(d).getDay())&&!data.sessions[sc.id+"_"+d]){
        const sk=(sc.skips||[]).includes(d);if(!sk||withCancelled)out.push(virtualOcc(sc,d,sk));
      }
      d=addDays(d,1);
    }
  });
  return out.sort(byTime);
}
function eligible(s){
  const att=s.attendance||{};
  return players().filter(p=>(p.active!==false&&(s.group==="All"||s.group===p.group))||att[p.id]).sort((a,b)=>a.name.localeCompare(b.name));
}
function attCount(s){
  const att=s.attendance||{},el=eligible(s);let inn=0,marked=0;const c={present:0,late:0,absent:0,excused:0};
  el.forEach(p=>{const st=att[p.id];if(st){marked++;c[st]++;if(st==="present"||st==="late")inn++}});
  return {inn,marked,elig:el.length,c};
}
function attStats(pid,since,until){
  let pr=0,la=0,ab=0,ex=0;const lim=until||today();
  Object.values(data.sessions).forEach(s=>{
    if(since&&s.date<since)return;if(s.date>lim)return;
    const st=s.attendance&&s.attendance[pid];
    if(st==="present")pr++;else if(st==="late")la++;else if(st==="absent")ab++;else if(st==="excused")ex++;
  });
  const den=pr+la+ab;return {pr,la,ab,ex,den,attended:pr+la,rate:den?Math.round((pr+la)/den*100):null};
}
function history(pid){return sessions().filter(s=>s.date<=today()&&s.attendance&&s.attendance[pid]).sort((a,b)=>byTime(b,a))}
function streak(pid){
  let kind=null,n=0;
  for(const s of history(pid)){
    const st=s.attendance[pid];if(st==="excused")continue;
    const k=st==="absent"?"absent":"in";
    if(kind===null)kind=k;if(k!==kind)break;n++;
  }
  return {kind,n};
}
function groupRate(list,since,until){let a=0,d=0;list.forEach(p=>{const s=attStats(p.id,since,until);a+=s.attended;d+=s.den});return d?Math.round(a/d*100):null}
function periodSince(){const t=today();return ui.period==="month"?t.slice(0,7)+"-01":ui.period==="30"?addDays(t,-30):ui.period==="90"?addDays(t,-90):null}
function assessFor(pid){return Object.keys(data.assessments).map(id=>Object.assign({id},data.assessments[id])).filter(a=>a.playerId===pid).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0))}
function avg(a){if(!a)return null;const v=SKILLS.map(s=>a.scores&&a.scores[s[0]]).filter(x=>typeof x==="number");return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}
const f1=n=>n==null?"—":n.toFixed(1);
const groupLabel=g=>g==="All"?"All groups":g;
const telHref=p=>p.phone?"tel:"+esc(p.phone.replace(/[^\d+]/g,"")):"";

/* ---------- Components ---------- */
function shirt(p){return `<span class="shirt${p.active===false?" off":""}" aria-hidden="true">${esc(p.number||initials(p.name))}</span>`}
function sessionRow(s,noDate){
  const a=attCount(s),d=parseISO(s.date);
  const tag=(s.type==="Match"||s.type==="Tournament")?`<span class="tag match">${esc(s.type)}</span> `:"";

  else if(s.date<=today()&&a.elig)right=`<span class="mark">Take attendance</span>`;
  const meta=[noDate?null:null,groupLabel(s.group),timeRange(s),s.location].filter(Boolean).join(", ");

function playerRow(p,right){

function chips(){

}
function delBtn(act,id,label){return `<p class="admin-only" style="margin-top:28px"><button class="btn danger slim" data-act="${act}" data-id="${esc(id)}">${label}</button></p>`}

/* ---------- Today ---------- */
function ring(pct){const r=30,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,pct||0))/100);
  return `<svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--present)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 38 38)"/></svg>`}
function ticket(s,label){
  const a=attCount(s),pct=a.elig?Math.round(a.inn/a.elig*100):0,match=s.type==="Match"||s.type==="Tournament";
  const meta=[groupLabel(s.group),s.endTime?"until "+s.endTime:"",s.location].filter(Boolean).join(", ");
  const stub=a.marked?`<span class="ringbox">${ring(pct)}<span class="ring-n">${a.inn}<small>/${a.elig}</small></span></span><span class="stub-l">players in</span>`
    :`<span class="stub-big">${a.elig}</span><span class="stub-l">expected</span><span class="stub-cta">Take attendance</span>`;
  return `<button class="ticket" data-act="open-session" data-id="${esc(s.id)}" aria-label="${esc(label+": "+(s.focus||s.type)+", "+meta)}">
    <span class="ticket-main"><span class="t-label">${label}${match?` <span class="tag match">${esc(s.type)}</span>`:""}</span>
    <span class="t-time">${esc(s.time||"Today")}</span><span class="t-title">${esc(s.focus||s.type)}</span><span class="t-meta">${esc(meta)}</span></span>
    <span class="ticket-stub">${stub}</span></button>`;
}
function viewHome(){
  const t=today(),ap=active();
  if(!isAdminView()&&!ap.length&&!sessions().length&&!schedules().length)return `<section class="welcome"><h2>Welcome, coach</h2><p class="muted" style="margin:0">${visibleGroups().length?"There are no players or sessions in your groups yet. Ask an academy admin to add them.":"You haven't been assigned to a group yet. Ask an academy admin to assign you."}</p></section>`;
  if(!ap.length&&!sessions().length&&!schedules().length){
    const step=(n,title,sub,act,btn)=>`<div class="step"><span class="step-n">${n}</span><span class="step-b"><b>${title}</b><span class="muted small">${sub}</span></span><button class="btn slim${n===1?" primary":""}" data-act="${act}">${btn}</button></div>`;
    return `<section class="welcome"><h2>Kick-off checklist</h2><p class="muted" style="margin-top:0">Three steps and your academy is ready for the first whistle.</p>
    ${step(1,"Add your players","Name, group, parent contact","new-player","Add player")}
    ${step(2,"Set the weekly practice","Days, time and pitch for each group","new-schedule","Set schedule")}
    ${step(3,"Set monthly fees","One fee per age group","fee-settings","Set fees")}
    <p style="margin:14px 0 0"><button class="link" data-act="settings">Name your academy and age groups</button></p></section>`;
  }
  const since=addDays(t,-30),rate=groupRate(ap,since),prev=groupRate(ap,addDays(t,-60),addDays(t,-31));
  let h="";

  // Matchday tickets
  const todays=occurrences(t,t);
  if(todays.length)h+=`<div class="tickets">${todays.map(s=>ticket(s,"Today")).join("")}</div>`;
  else{
    const next=occurrences(addDays(t,1),addDays(t,30))[0];
    if(next){const days=Math.round((parseISO(next.date)-parseISO(t))/864e5);
      const meta=[groupLabel(next.group),next.location].filter(Boolean).join(", ");
      h+=`<div class="tickets"><button class="ticket" data-act="open-session" data-id="${esc(next.id)}"><span class="ticket-main"><span class="t-label">Rest day. Next up</span>
        <span class="t-time">${fmt(next.date,{weekday:"short"})}${next.time?" "+esc(next.time):""}</span><span class="t-title">${esc(next.focus||next.type)}</span><span class="t-meta">${esc(meta)}</span></span>
        <span class="ticket-stub"><span class="stub-big">${days}</span><span class="stub-l">${days===1?"day to go":"days to go"}</span></span></button></div>`;
    }else h+=`<div class="tickets"><div class="ticket"><span class="ticket-main"><span class="t-label">Nothing scheduled</span><span class="t-title" style="margin-top:6px">${isAdminView()?"Set a weekly practice so sessions appear here.":"Plan a session for your group."}</span>
      <span style="margin-top:12px;display:block">${isAdminView()?`<button class="btn primary slim" data-act="new-schedule">Add weekly practice</button>`:`<button class="btn primary slim" data-act="new-session">Plan a session</button>`}</span></span></div></div>`;
  }

  if(!isAdminView()){const tp=programsOn(t,myCoachId());
    if(tp.length)h+=`<h2>Today's training program</h2><div class="pg-list">${tp.map(p=>progCard(p)).join("")}</div>`;}
  if(isAdminView()){const evn=events().find(e=>(e.end||e.start)>=t&&e.start<=addDays(t,30));
    if(evn){const dd=Math.round((parseISO(evn.start)-parseISO(t))/864e5),cn=evCount(evn);
      h+=`<button class="evban" data-act="open-event" data-id="${evn.id}"><span class="evban-l">${dd>0?`Starts in ${dd} day${dd===1?"":"s"}`:"Happening now"}</span><b>${esc(evn.name)}</b><span>${cn.n?`${cn.p} of ${cn.n} matches played`:"Set up teams and fixtures"}</span></button>`}}
  // Week strip
  const ws=weekStart(t),occW=occurrences(ws,addDays(ws,6));
  h+=`<div class="weekstrip" role="group" aria-label="This week">${[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i),n=occW.filter(s=>s.date===d).length,dt=parseISO(d);
    return `<button class="wday${d===t?" now":""}${d<t?" past":""}" data-act="tab" data-tab="schedule" aria-label="${fmt(d)}: ${n} session${n===1?"":"s"}"><span>${DAYN[dt.getDay()].slice(0,1)}</span><b>${dt.getDate()}</b><i>${"<em></em>".repeat(Math.min(n,3))}</i></button>`}).join("")}</div>`;

  // Next match
  const nm=occurrences(addDays(t,1),addDays(t,45)).find(s=>s.type==="Match"||s.type==="Tournament");
  if(nm)h+=`<button class="fixture" data-act="open-session" data-id="${esc(nm.id)}"><span class="fx-date"><b>${parseISO(nm.date).getDate()}</b>${fmt(nm.date,{month:"short"})}</span>
    <span style="min-width:0"><span class="fx-l">Next ${nm.type.toLowerCase()}</span><span class="fx-t">${esc(nm.focus||"Opponent to be confirmed")}</span><span class="smeta">${esc([groupLabel(nm.group),fmt(nm.date,{weekday:"long"}),nm.time,nm.location].filter(Boolean).join(", "))}</span></span></button>`;

  // Pulse
  const m=curMonth();let exp=0,col=0;const feeSet=Object.values(settings.groupFees||{}).some(v=>Number(v)>0)||players().some(p=>Number(p.feeOverride)>0);
  const L=ap.map(p=>Object.assign({L:ledger(p)},p));
  L.forEach(p=>{if(p.L.months.includes(m)){exp+=p.L.fee;col+=Math.min(p.L.fee,p.L.paid[m]||0)}});
  const fpct=exp?Math.round(col/exp*100):null;
  const d=rate!=null&&prev!=null?rate-prev:null;
  const groups=settings.groups.map(g=>[g,ap.filter(p=>p.group===g).length]).filter(x=>x[1]);
  h+=`<div class="pulse">
    <button class="tile tile-pitch" data-act="tab" data-tab="attendance"><span class="tile-l">Attendance, last 30 days</span><b class="tile-big">${rate==null?"—":rate+"<small>%</small>"}</b>
      <span class="tile-s">${d==null?(rate==null?"Take attendance to see trends":"Across all groups"):d===0?"Same as the month before":(d>0?"Up ":"Down ")+Math.abs(d)+" points on the month before"}</span></button>
    ${!isAdminView()?(()=>{const mc=cdoc(myCoachId()),n=coachSessions(Object.assign({id:myCoachId()},mc),m).length;return `<button class="tile" data-act="tab" data-tab="attendance"><span class="tile-l">Your sessions this month</span><b class="tile-big">${n}</b><span class="tile-s">With attendance taken</span></button>`})()
    :feeSet?`<button class="tile" data-act="tab" data-tab="fees"><span class="tile-l">Fees for ${fmtMonth(m,true).split(" ")[0]}</span><b class="tile-big">${fpct==null?"—":fpct+"<small>%</small>"}</b>
      <span class="minibar"><span style="width:${fpct||0}%"></span></span><span class="tile-s">${money(col)} of ${money(exp)}</span></button>`
    :`<button class="tile" data-act="fee-settings"><span class="tile-l">Fees</span><b class="tile-big" style="font-size:1.6rem;margin-top:8px">Not set up</b><span class="tile-s">Set monthly fees to track payments</span></button>`}
  </div>
  <button class="squadline" data-act="tab" data-tab="squad"><b>${ap.length}</b> active player${ap.length===1?"":"s"}${groups.length?`<span class="muted">${groups.map(([g,n])=>` ${esc(g)} ${n}`).join(",")}</span>`:""}<span class="chev" aria-hidden="true">›</span></button>`;

  // To do
  const missing=occurrences(addDays(t,-14),addDays(t,-1)).filter(s=>!attCount(s).marked&&attCount(s).elig);
  const runs=ap.map(p=>Object.assign({st:streak(p.id)},p)).filter(p=>p.st.kind==="absent"&&p.st.n>=3);
  const lowAtt=ap.map(p=>Object.assign({s:attStats(p.id,since)},p)).filter(p=>p.s.den>=3&&p.s.rate<70&&!runs.find(r=>r.id===p.id));
  const feeOver=L.filter(p=>p.L.overdue);
  const due=ap.filter(p=>{const a=assessFor(p.id);return !a.length||a[a.length-1].date<addDays(t,-60)});
  const pl=n=>n===1?"player":"players";
  const todo=[];
  if(missing.length)todo.push(missing.length===1?["open-session",missing[0].id,1,"absent",`Attendance not taken for ${esc(missing[0].focus||missing[0].type)}, ${fmt(missing[0].date)}`]:["tab","attendance",missing.length,"absent","Past sessions without attendance"]);
  if(runs.length)todo.push(["tab","attendance",runs.length,"absent",`${pl(runs.length)} missed 3 or more in a row`]);
  const adm=isAdminView();
  const salOwed=adm?activeCoaches().filter(c=>coachOwed(c).owed>0):[];
  const reqs=[];
  if(adm&&programs().length){const ws0=weekStart(t),have=new Set(programsInWeek(ws0).map(p=>p.coachId)),miss=activeCoaches().filter(c=>!have.has(c.id));
    if(miss.length)todo.push(["go-programs","",miss.length,"excused",`${miss.length===1?"coach":"coaches"} without a training program this week`])}
  if(reqs.length)todo.push(["go-coaches","",reqs.length,"late",`coach login request${reqs.length===1?"":"s"} to review`]);
  if(salOwed.length)todo.push(["go-salaries","",salOwed.length,"late",`${salOwed.length===1?"coach":"coaches"} with unpaid salary from earlier months`]);
  const noCoach=adm&&coaches().length?settings.groups.filter(g=>active().some(p=>p.group===g)&&!coachesFor(g).length):[];
  if(noCoach.length)todo.push(["go-coaches","",noCoach.length,"excused",`group${noCoach.length===1?"":"s"} without a coach: ${esc(noCoach.join(", "))}`]);
  if(adm&&feeOver.length)todo.push(["tab","fees",feeOver.length,"late",`${pl(feeOver.length)} with overdue fees, ${money(feeOver.reduce((x,p)=>x+p.L.balance,0))} in total`]);
  if(lowAtt.length)todo.push(["tab","attendance",lowAtt.length,"late",`${pl(lowAtt.length)} below 70% attendance`]);
  if(due.length)todo.push(["tab","progress",due.length,"excused",`${pl(due.length)} due for a skills assessment`]);
  h+=`<h2>To do</h2>`+(todo.length?`<div class="list">${todo.map(([act,v,n,c,txt])=>`<button class="todo" data-act="${act}" ${act==="tab"?`data-tab="${v}"`:act==="open-session"?`data-id="${esc(v)}"`:""}><span class="todo-n" style="background:var(--${c})">${n}</span><span class="todo-t">${txt}</span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`
    :`<div class="panel allclear"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--present)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>All clear. Attendance, fees and assessments are up to date.</span></div>`);

  // Form guide
  const rec=sessions().filter(s=>s.date<=t&&Object.keys(s.attendance||{}).length).sort((a,b)=>byTime(b,a)).slice(0,6).reverse();
  if(rec.length){
    h+=`<h2>Form guide</h2><p class="muted small" style="margin:-4px 0 10px">Turnout at your last ${rec.length} session${rec.length===1?"":"s"}, oldest to newest.</p>
    <div class="formguide">${rec.map(s=>{const a=attCount(s),p=a.elig?Math.round(a.inn/a.elig*100):0,c=p>=80?"present":p>=60?"late":"absent";
      return `<button class="fg" data-act="open-session" data-id="${esc(s.id)}" aria-label="${fmt(s.date)}, ${p}% turnout"><b style="background:var(--${c})">${p}<small>%</small></b><span>${fmt(s.date,{day:"numeric",month:"short"})}</span></button>`}).join("")}</div>`;
  }

  // Spotlight
  const spots=[];
  const ever=ap.map(p=>Object.assign({st:streak(p.id)},p)).filter(p=>p.st.kind==="in"&&p.st.n>=3).sort((a,b)=>b.st.n-a.st.n)[0];
  if(ever)spots.push([ever,"Ever-present",`${ever.st.n} sessions in a row`]);
  const imp=ap.map(p=>{const as=assessFor(p.id);return Object.assign({d:as.length>1?avg(as[as.length-1])-avg(as[0]):0},p)}).filter(p=>p.d>0).sort((a,b)=>b.d-a.d)[0];
  if(imp)spots.push([imp,"Most improved",`Rating up ${f1(imp.d)}`]);
  if(spots.length)h+=`<h2>In the spotlight</h2><div class="spots">${spots.map(([p,l,s])=>`<button class="spot" data-act="open-player" data-id="${p.id}">${shirt(p)}<span class="spot-l">${l}</span><span class="spot-n">${esc(p.name)}</span><span class="spot-s">${s}</span></button>`).join("")}</div>`;
  return h;
}

/* ---------- Schedule ---------- */
const GCOL=["#1D6A3A","#2F5DA8","#8A3FA0","#B4580E","#0F7C80","#A23B5A","#5B6A2E","#3C4A9E"];
function gcol(g){if(g==="All")return "";const i=settings.groups.indexOf(g);return GCOL[(i<0?0:i)%GCOL.length]}
function gpill(g){const c=gcol(g);return `<span class="gp${c?"":" gp-all"}"${c?` style="background:${c}"`:""}>${esc(g==="All"?"All groups":g)}</span>`}
const PIN=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
function schedCard(s){
  const a=attCount(s),match=s.type==="Match"||s.type==="Tournament",t=today();
  let right="";
  if(s.cancelled)right=`<span class="sc-off">Cancelled</span>`;
  else if(a.marked){const p=a.elig?Math.round(a.inn/a.elig*100):0;right=`<span class="sc-turn" style="background:var(--${p>=80?"present":p>=60?"late":"absent"})">${a.inn}/${a.elig}</span>`}
  else if(s.date<=t&&a.elig)right=`<span class="sc-mark">Take attendance</span>`;
  else right=`<span class="chev" aria-hidden="true">›</span>`;
  return `<button class="sc${match?" is-match":""}${s.cancelled?" is-off":""}" data-act="open-session" data-id="${esc(s.id)}" style="--g:${gcol(s.group)||"var(--muted)"}">

function viewSchedule(){

    <p class="muted small" style="margin:4px 0 12px">Repeats every week. Tap a row to change it.</p>`;
  if(!scs.length)h+=`<div class="panel empty">No weekly practices yet. Add one for each group, for example U10 on Mondays and Wednesdays at 16:30.</div>`;
  else{
    h+=`<div class="tt"><div class="tt-row tt-headrow" aria-hidden="true"><span></span>${WEEK_ORDER.map(d=>`<span class="tt-dh">${DAYN[d].slice(0,2)}</span>`).join("")}</div>
    ${scs.map(sc=>{const ended=sc.endDate&&sc.endDate<t,c=gcol(sc.group)||"var(--muted)";
      const cn=coachesFor(sc.group).map(c=>c.name.split(" ")[0]);
      const meta=[sc.focus,sc.location,cn.length?"Coach "+cn.join(" and "):"",sc.endDate?(ended?"Ended":"Until "+fmt(sc.endDate,{day:"numeric",month:"short"})):""].filter(Boolean).join(", ");

        <span class="tt-meta">${esc((sc.type||"Training")+(sc.endTime?", "+timeRange(sc):""))}${meta?", "+esc(meta):""}</span></button>`}).join("")}</div>`;
  }

  if(past.length){

function viewAttendance(){
  const t=today(),since=periodSince(),ps=active().filter(inGroup);
  if(!isAdminView()&&!can("reports"))return coachAttendanceTop();
  let h=(isAdminView()||!can("attendance")?"":coachAttendanceTop())+`<h2>${isAdminView()?"Attendance":"Attendance records"}</h2>`+chips()+`<div class="chips" role="group" aria-label="Time period">${PERIODS.map(([k,l])=>`<button class="chip" data-act="period" data-p="${k}" aria-pressed="${ui.period===k}">${l}</button>`).join("")}</div>`;
  if(!ps.length)return h+`<div class="panel empty">No players in this group yet.</div>`;
  const recorded=sessions().filter(s=>(!since||s.date>=since)&&s.date<=t&&sessGroupOk(s)&&Object.keys(s.attendance||{}).length);
  const turnout=recorded.length?Math.round(recorded.reduce((x,s)=>x+attCount(s).inn,0)/recorded.length):null;
  const rate=groupRate(ps,since);
  h+=`<div class="stats">
    <div class="stat"><b>${rate==null?"—":rate+"%"}</b><span>Attendance rate</span></div>

    <div class="stat"><b>${turnout==null?"—":turnout}</b><span>Average turnout</span></div></div>`;

  const missing=occurrences(addDays(t,-14),t).filter(s=>sessGroupOk(s)&&!attCount(s).marked&&attCount(s).elig);
  if(missing.length)h+=`<h3>Not taken yet</h3><p class="muted small" style="margin:-4px 0 8px">Practices from the last 2 weeks with no attendance.</p><div class="list">${missing.slice().reverse().map(s=>sessionRow(s)).join("")}</div>`;

  const runs=ps.map(p=>Object.assign({st:streak(p.id)},p)).filter(p=>p.st.kind==="absent"&&p.st.n>=3).sort((a,b)=>b.st.n-a.st.n);

      <span class="pright">${p.phone?`<a class="btn slim" href="${telHref(p)}" style="text-decoration:none;display:inline-block">Call</a>`:`<span class="muted">No phone</span>`}</span></div>`).join("")}</div>`;

  // Trend

  const vals=months.map(m=>groupRate(ps,m+"-01",monthEnd(m)<t?monthEnd(m):t));
  if(vals.some(v=>v!=null)){
    h+=`<h3>Monthly trend</h3><div class="panel"><div class="trend" role="img" aria-label="Attendance rate for the last 6 months">${months.map((m,i)=>`<div><b>${vals[i]==null?"—":vals[i]+"%"}</b><i style="height:${vals[i]==null?0:Math.max(2,vals[i])}%;${i===5?"background:var(--bib)":""}"></i><span>${fmtMonth(m)}</span></div>`).join("")}</div></div>`;
  }

  // Register
  const m=ui.regMonth,mStart=m+"-01",mEnd=monthEnd(m);
  const cols=sessions().filter(s=>s.date>=mStart&&s.date<=mEnd&&sessGroupOk(s)).sort(byTime);
  const rowsP=players().filter(p=>inGroup(p)&&(p.active!==false||cols.some(s=>s.attendance&&s.attendance[p.id]))).sort((a,b)=>a.name.localeCompare(b.name));
  h+=`<div class="spread" style="margin-top:24px"><h3 style="margin:0">Register</h3>${DL&&cols.length?`<button class="btn slim" data-act="export">Export CSV</button>`:""}</div>
  <div class="weeknav" style="margin-top:8px"><button class="round" data-act="regmonth" data-n="-1" aria-label="Previous month">‹</button><b>${fmtMonth(m,true)}</b><button class="round" data-act="regmonth" data-n="1" aria-label="Next month">›</button></div>`;
  if(!cols.length)h+=`<div class="panel empty">No sessions recorded in ${fmtMonth(m,true)}.</div>`;
  else{
    h+=`<div class="reg" tabindex="0" aria-label="Attendance register"><table><thead><tr><th scope="col">Player</th>${cols.map(s=>`<th scope="col"><button class="link" style="padding:0;color:inherit;font-weight:inherit" data-act="open-session" data-id="${esc(s.id)}" title="${esc((s.focus||s.type)+", "+groupLabel(s.group))}"><b>${parseISO(s.date).getDate()}</b>${DAYN[parseISO(s.date).getDay()].slice(0,2)}</button></th>`).join("")}<th scope="col">Rate</th></tr></thead><tbody>
    ${rowsP.map(p=>{let a=0,d=0;const cells=cols.map(s=>{const el=s.group==="All"||s.group===p.group||(s.attendance&&s.attendance[p.id]);const st=s.attendance&&s.attendance[p.id];
        if(st==="present"||st==="late"){a++;d++}else if(st==="absent")d++;
        const sd=STATUS.find(x=>x[0]===st);return `<td>${!el?"":st?`<span class="cell ${st}" title="${sd[2]}">${sd[1]}</span>`:`<span class="cell none" title="Not marked"></span>`}</td>`}).join("");
      const r=d?Math.round(a/d*100):null;
      return `<tr><td>${esc(p.name)}</td>${cells}<td class="${r!=null&&r<70?"low":""}">${r==null?"—":r+"%"}</td></tr>`}).join("")}
    </tbody></table></div>
    <div class="legend">${STATUS.map(([k,l,full])=>`<span><i style="background:var(--${k})"></i>${l} ${full}</span>`).join("")}</div>`;
  }

  if(isAdminView()&&activeCoaches().length){
    h+=`<h3 style="margin-top:24px">Coach attendance</h3><div class="list">${activeCoaches().map(c=>{const a=coachAttStats(c.id,since);
      return `<button class="prow" data-act="open-coach" data-id="${c.id}">${cbadge(c)}<span><span class="pname">${esc(c.name)}</span><span class="pmeta">Present ${a.present}, late ${a.late}, absent ${a.absent}, excused ${a.excused}${a.unmarked?`, ${a.unmarked} not marked`:""}</span></span>
      <span class="pright"><b class="${a.rate!=null&&a.rate<80?"low":""}">${a.rate==null?"—":a.rate+"%"}</b></span></button>`}).join("")}</div>`;
  }
  // Player table
  const rows=ps.map(p=>Object.assign({s:attStats(p.id,since)},p));
  rows.sort(ui.sort==="low"?(a,b)=>((a.s.rate==null?101:a.s.rate)-(b.s.rate==null?101:b.s.rate))||a.name.localeCompare(b.name):(a,b)=>a.name.localeCompare(b.name));
  h+=`<div class="spread" style="margin-top:24px"><h3 style="margin:0">By player</h3><button class="link" data-act="sort">${ui.sort==="low"?"Sort A to Z":"Sort lowest first"}</button></div>
  <div class="list" style="margin-top:8px">${rows.map(p=>playerRow(p,`<b class="${p.s.rate!=null&&p.s.rate<70?"low":""}">${p.s.rate==null?"—":p.s.rate+"%"}</b><span class="counts">P ${p.s.pr}, L ${p.s.la}, A ${p.s.ab}, E ${p.s.ex}</span>`)).join("")}</div>`;
  return h;
}
async function exportCSV(){
  if(!DL)return;
  const m=ui.regMonth,mStart=m+"-01",mEnd=monthEnd(m);
  const cols=sessions().filter(s=>s.date>=mStart&&s.date<=mEnd&&sessGroupOk(s)).sort(byTime);
  const rowsP=players().filter(p=>inGroup(p)&&(p.active!==false||cols.some(s=>s.attendance&&s.attendance[p.id]))).sort((a,b)=>a.name.localeCompare(b.name));
  const q=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[["Player ID","Player","Group"].concat(cols.map(s=>s.date+(s.time?" "+s.time:"")+" "+(s.focus||s.type)),["Attended","Missed","Excused","Rate"]).map(q).join(",")];
  rowsP.forEach(p=>{let a=0,ab=0,ex=0;const cells=cols.map(s=>{const st=s.attendance&&s.attendance[p.id];if(st==="present"||st==="late")a++;else if(st==="absent")ab++;else if(st==="excused")ex++;
    const lab=st?STATUS.find(x=>x[0]===st)[2]:"";const note=s.attNotes&&s.attNotes[p.id];return lab+(note?" ("+note+")":"")});
    lines.push([p.code||"",p.name,p.group||""].concat(cells,[a,ab,ex,(a+ab)?Math.round(a/(a+ab)*100)+"%":""]).map(q).join(","))});
  const name=((settings.name||"academy").replace(/[^\w-]+/g,"-")+"-attendance-"+m+(ui.group!=="All"?"-"+ui.group:"")+".csv").toLowerCase();
  try{await DL.save({filename:name,data:lines.join("\n")})}catch(e){if(e&&e.code!=="declined")toast("Couldn't export the file here.")}
}

/* ---------- Squad ---------- */
function squadList(){
  const q=ui.q.trim().toLowerCase();
  const ps=players().filter(p=>inGroup(p)&&(!q||p.name.toLowerCase().includes(q)||(p.code||"").toLowerCase().includes(q)||digits(p.phone).includes(digits(q)||"~")))
    .sort((a,b)=>((a.active===false)-(b.active===false))||a.name.localeCompare(b.name));
  if(!ps.length)return `<div class="panel empty">${players().length?"No players match.":"No players yet. Add your first player."}</div>`;

function radar(first,latest){
  const n=SKILLS.length,cx=130,cy=118,R=78;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const poly=sc=>SKILLS.map((s,i)=>pt(i,(sc&&sc[s[0]])||0).map(x=>x.toFixed(1)).join(",")).join(" ");
  let g="";
  for(let v=1;v<=5;v++)g+=`<polygon points="${SKILLS.map((s,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  SKILLS.forEach((s,i)=>{const [x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const a=-Math.PI/2+i*2*Math.PI/n,lx=cx+(R+12)*Math.cos(a),ly=cy+(R+12)*Math.sin(a),c=Math.cos(a);
    const anchor=Math.abs(c)<.2?"middle":c>0?"start":"end";
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--muted)" font-family="Barlow,sans-serif">${s[1]}</text>`});
  if(first&&first!==latest)g+=`<polygon points="${poly(first.scores)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  g+=`<polygon points="${poly(latest.scores)}" fill="var(--present)" fill-opacity=".25" stroke="var(--present)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 260 236" role="img" aria-label="Skill profile chart">${g}</svg>`;
}

function viewPlayer(id){

  <div class="row" style="margin:14px 0 16px"><button class="btn primary" data-act="assess" data-id="${id}">New assessment</button><button class="btn" data-act="edit-player" data-id="${id}">Edit details</button></div>

    <p class="muted small" style="text-align:center;margin:0 0 10px">${as.length>1?`Solid: ${fmt(last.date)}. Dashed: first assessment, ${fmt(first.date)}.`:`Assessed ${fmt(last.date)}.`}</p>
    ${SKILLS.map(([k,l])=>{const v=last.scores[k]||0,d=as.length>1?v-(first.scores[k]||0):0;
      return `<div class="skill"><span>${l}</span><span class="pips" aria-label="${v} of 5, ${LEVELS[v]||""}">${[1,2,3,4,5].map(i=>`<i class="${i<=v?"on":""}"></i>`).join("")}</span>
      <span class="delta ${d>0?"up":d<0?"down":"muted"}">${as.length>1?(d>0?"+"+d:d<0?d:"0"):v}</span></div>`}).join("")}</div>`;
    h+=`<h3>Assessment history</h3><div class="list">${as.slice().reverse().map(a=>`<div class="item"><div class="spread"><b>${fmt(a.date,{day:"numeric",month:"short",year:"numeric"})}</b>

      ${a.notes?`<p style="margin:6px 0 0;white-space:pre-wrap">${esc(a.notes)}</p>`:""}</div>`).join("")}</div>`;
  }
  if(isAdminView())h+=`<div class="admin-only">${playerFeesSection(p)}</div>`;
  const recent=history(id).slice(0,12);
  h+=`<h2>Recent attendance</h2>`+(recent.length?`<div class="list">${recent.map(x=>{const stt=x.attendance[id];const lab=STATUS.find(q=>q[0]===stt)[2];const note=x.attNotes&&x.attNotes[id];

  if(p.guardian||p.phone||p.notes){
    h+=`<h2>Contact and notes</h2><div class="panel">${p.guardian?`<p style="margin:0 0 6px"><b>Parent or guardian:</b> ${esc(p.guardian)}</p>`:""}
    ${p.phone?`<p style="margin:0 0 6px"><b>Phone:</b> <a href="${telHref(p)}">${esc(p.phone)}</a></p>`:""}

/* ---------- Progress ---------- */
function viewProgress(){
  const ap=active().filter(inGroup);
  let h=`<h2>Progress</h2>`+chips();
  if(!ap.length)return h+`<div class="panel empty">No players in this group yet.</div>`;
  const withA=ap.map(p=>{const as=assessFor(p.id);return Object.assign({as,first:as[0],last:as[as.length-1]},p)});
  const improved=withA.filter(p=>p.as.length>1).map(p=>Object.assign({d:avg(p.last)-avg(p.first)},p)).filter(p=>p.d>0).sort((a,b)=>b.d-a.d).slice(0,5);
  if(improved.length)h+=`<h3>Most improved</h3><div class="list">${improved.map(p=>playerRow(p,`<b class="up">+${f1(p.d)}</b>${f1(avg(p.first))} to ${f1(avg(p.last))}`)).join("")}</div>`;
  const rated=withA.filter(p=>p.last);
  if(rated.length){
    h+=`<h3>Group average by skill</h3><div class="panel">${SKILLS.map(([k,l])=>{const v=rated.reduce((x,p)=>x+(p.last.scores[k]||0),0)/rated.length;
      return `<div class="skill"><span>${l}</span><span class="bar" style="margin:0"><span style="width:${v/5*100}%;background:var(--pitch)"></span></span><span class="delta">${f1(v)}</span></div>`}).join("")}
      <p class="muted small" style="margin:8px 0 0">Based on the latest assessment of ${rated.length} player${rated.length>1?"s":""}. Low scores show what to focus on in training.</p></div>`;
  }
  h+=`<h3>All players</h3><div class="list">${withA.map(p=>playerRow(p,p.last?`<b>${f1(avg(p.last))}</b>${fmt(p.last.date,{day:"numeric",month:"short"})}`:`<span class="muted">Not assessed</span>`)).join("")}</div>`;
  return h;
}

/* ---------- Fees ---------- */
const METHODS=["Cash","Bank transfer","Card","Other"];
const CHARGE_TITLES=["Registration fee","Kit and uniform","Tournament fee","Trip or transport","Other"];
const curMonth=()=>today().slice(0,7);
function money(n){const c=settings.currency||"MVR";const v=Math.round((Number(n)||0)*100)/100;return c+" "+v.toLocaleString(undefined,{maximumFractionDigits:2})}
const payments=()=>Object.keys(data.payments).map(id=>Object.assign({id},data.payments[id]));
const charges=()=>Object.keys(data.charges).map(id=>Object.assign({id},data.charges[id]));
const paysFor=pid=>payments().filter(x=>x.playerId===pid).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const chargesFor=pid=>charges().filter(x=>x.playerId===pid).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
function feeFor(p){return Math.max(0,baseFee(p)-((sibInfo(p)||{}).disc||0))}
function feeStartOf(p){return p.feeStart||(p.createdAt?iso(new Date(p.createdAt)).slice(0,7):curMonth())}
function chargeMonths(p){
  const out=[],cur=curMonth();let end=p.feeEnd||cur;if(end>cur)end=cur;
  if(p.active===false&&!p.feeEnd)return out;
  let m=feeStartOf(p),g=0;const lo=addMonths(cur,-35);if(m<lo)m=lo;
  while(m<=end&&g++<40){out.push(m);m=addMonths(m,1)}
  return out;
}
function ledger(p){
  const fee=feeFor(p),months=chargeMonths(p),paid={},ps=paysFor(p.id);
  ps.slice().reverse().filter(x=>x.months&&x.months.length).forEach(x=>{
    let rem=Number(x.amount)||0;const ms=x.months.slice().sort();
    ms.forEach((m,i)=>{const need=Math.max(0,fee-(paid[m]||0));const take=i===ms.length-1?rem:Math.min(rem,need);paid[m]=(paid[m]||0)+take;rem-=take});
  });
  const owedMonths=months.filter(m=>(paid[m]||0)<fee);
  const owedMonthly=months.reduce((s,m)=>s+Math.max(0,fee-(paid[m]||0)),0);
  const advance=Object.keys(paid).reduce((s,m)=>s+Math.max(0,paid[m]-(months.includes(m)?fee:0)),0);
  const chs=chargesFor(p.id).map(c=>{const pd=ps.filter(x=>x.chargeId===c.id).reduce((s,x)=>s+(Number(x.amount)||0),0);return Object.assign({paid:pd,owed:Math.max(0,(Number(c.amount)||0)-pd)},c)});
  const general=ps.filter(x=>!(x.months&&x.months.length)&&!x.chargeId).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const balance=owedMonthly+chs.reduce((s,c)=>s+c.owed,0)-general-advance;
  const cur=curMonth(),day=parseISO(today()).getDate(),dueDay=Number(settings.dueDay)||10;
  const overdue=balance>0&&(owedMonths.some(m=>m<cur)||(owedMonths.includes(cur)&&day>dueDay)||chs.some(c=>c.owed>0&&c.date<addDays(today(),-14)));
  return {fee,months,paid,owedMonths,chs,balance,overdue};
}
function monthStatus(L,m){
  const pd=L.paid[m]||0;
  if(L.fee===0)return "exempt";
  if(pd>=L.fee)return "paid";
  if(pd>0)return "partial";
  return L.months.includes(m)?"unpaid":"none";
}
const STLAB={paid:"Paid",partial:"Part paid",unpaid:"Unpaid",exempt:"No fee",none:"Not due"};
const STCLS={paid:"present",partial:"late",unpaid:"absent",exempt:"excused",none:"excused"};

  if(!rows.length)h+=`<div class="panel empty">No players are charged fees for ${fmtMonth(m,true)}.</div>`;

  else h+=`<div class="list">${list.map(p=>`<div class="prow">${shirt(p)}
      <span style="min-width:0"><button class="link pname" style="padding:0;color:var(--ink);text-align:left" data-act="open-player" data-id="${p.id}">${esc(p.name)}</button>
      <span class="pmeta">${esc(p.code||"")}${p.code?", ":""}${p.L.fee?money(p.L.fee)+" a month":"No fee"}${(sibInfo(p)||{}).disc?" (sibling discount)":""}${p.L.balance>0?`, <span class="${p.L.overdue?"low":""}">owes ${money(p.L.balance)}</span>`:p.L.balance<0?`, credit ${money(-p.L.balance)}`:""}</span></span>
      <span class="pright row" style="gap:6px;flex-wrap:nowrap">${pill(p.st,p.L.overdue)}
      ${p.L.balance>0&&p.phone?`<button class="nbtn" data-act="remind" data-id="${p.id}" aria-label="Send reminder to ${esc(p.guardian||"parent")}" title="Send reminder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>`:""}
      <button class="btn slim" data-act="pay" data-id="${p.id}">Pay</button></span></div>`).join("")}</div>`;
  h+=`<div class="spread" style="margin-top:24px"><h3 style="margin:0">Received in ${fmtMonth(m,true)}</h3><b>${money(recSum)}</b></div>`;
  h+=received.length?`<div class="list" style="margin-top:8px">${received.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(payRow).join("")}</div>`:`<p class="muted">No payments recorded this month.</p>`;
  h+=`<div class="row" style="margin-top:24px"><button class="btn slim" data-act="charge">Add extra charge</button><button class="btn slim" data-act="fee-settings">Fee settings</button>
    ${DL?`<button class="btn slim" data-act="fee-export">Export ${fmtMonth(m)} to CSV</button>`:""}</div>`;

async function putMany(col,entries,silent){

const digits=s=>String(s||"").replace(/\D/g,"");
function famKey(p){if(p.familyId)return p.familyId;const d=digits(p.phone);return d.length>=6?"ph:"+d.slice(-7):null}
const hasOverride=p=>p.feeOverride!==""&&p.feeOverride!=null&&!isNaN(Number(p.feeOverride));
function baseFee(p){if(p.feeExempt)return 0;if(hasOverride(p))return Number(p.feeOverride);return Number((settings.groupFees||{})[p.group]||0)}
function familyOf(p){const k=famKey(p);if(!k)return [];return players().filter(q=>q.active!==false&&famKey(q)===k)}
function sibInfo(p){
  const sd=settings.sibling||{},v=Number(sd.value);
  const fam=familyOf(p);if(fam.length<2)return null;
  const payers=fam.filter(q=>!q.feeExempt&&!hasOverride(q)&&baseFee(q)>0)
    .sort((a,b)=>baseFee(b)-baseFee(a)||(a.createdAt||0)-(b.createdAt||0)||a.id.localeCompare(b.id));
  const idx=payers.findIndex(q=>q.id===p.id);
  let disc=0;
  if(v>0&&idx>0){const b=baseFee(p);disc=sd.kind==="amount"?Math.min(b,v):Math.round(b*v)/100}
  return {n:fam.length,rank:idx+1,disc,sibs:fam.filter(q=>q.id!==p.id),custom:hasOverride(p)};
}

async function runImport(){
  if(!impState)return;
  const fd=new FormData(form),upd=fd.get("impExisting")!=="skip",addG=fd.get("impAddGroups")==="on",defG=fd.get("impDefGroup")||settings.groups[0];
  if(addG&&impState.newGroups.length){settings=Object.assign({},settings,{groups:settings.groups.concat(impState.newGroups)});saveSettings()}
  let n=maxCodeNum();const used=new Set(players().map(p=>(p.code||"").toLowerCase()).filter(Boolean));
  const entries=[];let added=0,updated=0;
  impState.recs.forEach(r=>{
    const grp=r.group&&settings.groups.includes(r.group)?r.group:defG;
    if(r.match){
      if(!upd)return;
      const o=Object.assign({},data.players[r.match]);
      ["name","position","number","dob","guardian","phone","notes"].forEach(k=>{if(r[k])o[k]=r[k]});
      if(r.group)o.group=grp;if(r.fee!=="")o.feeOverride=r.fee;
      entries.push([r.match,o]);updated++;
    }else{
      let code=r.code&&!used.has(r.code.toLowerCase())?r.code:"";
      if(!code){do{code=fmtCode(++n)}while(used.has(code.toLowerCase()))}
      used.add(code.toLowerCase());
      entries.push([uid(),{name:r.name,code,group:grp,position:r.position,number:r.number,dob:r.dob,guardian:r.guardian,phone:r.phone,notes:r.notes,
        active:true,createdAt:Date.now()+added,feeOverride:r.fee,feeNote:"",feeExempt:false,feeStart:curMonth(),feeEnd:""}]);added++;
    }
  });
  impState=null;
  if(!entries.length){toast("Nothing to import.");return}
  toast(`Importing ${entries.length} player${entries.length===1?"":"s"}…`);
  const fail=await putMany("players",entries);
  toast(fail?`${entries.length-fail} saved, ${fail} couldn't be saved.`:`${added} added${updated?`, ${updated} updated`:""}.`);
}

/* Admin housekeeping: move pay details to the admin-only store, give codes, approve logins */
let adminChecked=false,linkBusy=false;
function adminHousekeeping(){
  if(!isAdminView()||ui.preview||!ready())return;
  if(!adminChecked){
    adminChecked=true;
    const PAYF=["salaryType","monthly","rate","bank"];const pubs=[],privs=[];
    Object.keys(data.coaches).forEach(id=>{
      const c=data.coaches[id],priv=Object.assign({},data.coachPrivate[id]||{});let changed=false;
      const pub=Object.assign({},c);
      PAYF.forEach(k=>{if(k in pub){if(priv[k]==null)priv[k]=pub[k];delete pub[k];changed=true}});
      if("accessCode" in pub){if(!priv.accessCode)priv.accessCode=pub.accessCode;delete pub.accessCode;changed=true}
      if(!priv.accessCode&&!pub.userId){priv.accessCode=newAccessCode();changed=true}
      if(changed){privs.push([id,priv]);pubs.push([id,pub])}
    });
    if(mode==="cloud"&&privs.length)putMany("coachPrivate",privs,true).then(()=>putMany("coaches",pubs,true));
    else if(privs.length){privs.forEach(([i,o])=>data.coachPrivate[i]=o);pubs.forEach(([i,o])=>data.coaches[i]=o);saveLocal()}
  }
  if(mode!=="cloud"||linkBusy)return;
  const linked=new Set(Object.values(data.coaches).map(c=>c.userId).filter(Boolean));
  const todo=Object.keys(data.coachLinks).filter(uid=>!linked.has(uid)).map(uid=>{const l=data.coachLinks[uid];
    const cid=Object.keys(data.coachPrivate).find(k=>data.coachPrivate[k].accessCode&&String(l.code||"").toUpperCase()===data.coachPrivate[k].accessCode&&data.coaches[k]&&!data.coaches[k].userId);
    return cid?[uid,cid]:null}).filter(Boolean);
  if(!todo.length)return;
  linkBusy=true;
  (async()=>{for(const [uid,cid] of todo){await approveLink(uid,cid,true)}linkBusy=false})();
}
async function approveLink(uid,cid,auto){
  const pub=Object.assign({},data.coaches[cid],{userId:uid}),priv=Object.assign({},data.coachPrivate[cid]||{},{accessCode:newAccessCode()});
  await put("coaches",cid,pub);await put("coachPrivate",cid,priv);
  toast(`${pub.name} ${auto?"connected their coach login":"is now linked"}`);
}

  const uid=data.coaches[cid].userId;
  await put("coaches",cid,Object.assign({},data.coaches[cid],{userId:""}));
  await put("coachPrivate",cid,Object.assign({},data.coachPrivate[cid]||{},{accessCode:newAccessCode()}));

}

async function copyText(t,okMsg,selectEl){
  try{if(navigator.clipboard&&window.isSecureContext!==false){await navigator.clipboard.writeText(t);toast(okMsg);return}}catch(e){}
  const host=sheet.open?sheet:document.body;
  const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";host.appendChild(a);a.focus();a.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();
  if(ok){toast(okMsg);return}
  if(selectEl){selectEl.focus();selectEl.select();if(selectEl.setSelectionRange)selectEl.setSelectionRange(0,selectEl.value.length);toast("Link selected. Press and hold, then tap Copy.")}
  else showCopySheet(t);
}
function showCopySheet(t){
  openSheet(`<h2>Copy this text</h2><p class="muted small" style="margin:0">Your browser blocked automatic copying. Press and hold the text, then tap Select all and Copy.</p>
  <textarea id="copyBox" readonly style="width:100%;min-height:140px;font:inherit;font-size:.92rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg)">${esc(t)}</textarea>`+`<div class="actions"><button class="btn primary" value="cancel">Done</button></div>`,()=>{});
  setTimeout(()=>{const c=$("#copyBox");if(c){c.focus();c.select()}},50);
}
