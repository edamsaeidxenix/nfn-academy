function stageKey(g){
  if(!g||g==="All")return null;const s=String(g).toLowerCase();
  if(/16\s*\+|senior|open|adult|u\s*-?\s*(1[7-9]|2\d)/.test(s))return "16+";
  const m=/u\s*-?\s*(\d+)/.exec(s)||/under\s*(\d+)/.exec(s)||/(\d+)/.exec(s);if(!m)return null;
  const n=Number(m[1]);return n<=8?"U8":n<=10?"U10":n<=12?"U12":n<=14?"U14":n<=16?"U16":"16+";
}
function stageIdxFor(label){
  const s=label.toLowerCase();
  if(/review|recovery|fun challenge/.test(s))return 5;
  if(/arrival|activation|free play/.test(s))return 0;
  if(/movement|technical|mastery|dynamic/.test(s))return 1;
  if(/1v1|2v1|2v2|under pressure|position|skill/.test(s))return 2;
  if(/match/.test(s))return 4;
  if(/tactical|game-related|game problem|phase/.test(s))return 3;
  if(/game|play/.test(s))return 4;
  return 1;
}

/* fixture generation */
function rr(ids,double){
  const list=ids.slice();if(list.length%2)list.push(null);
  const n=list.length,out=[];let arr=list.slice();
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const x=arr[i],y=arr[n-1-i];if(x&&y)out.push({round:r+1,h:(r%2?y:x),a:(r%2?x:y)})}
    arr=[arr[0]].concat([arr[n-1]],arr.slice(1,n-1));
  }
  if(double){const k=n-1;out.slice().forEach(m=>out.push({round:m.round+k,h:m.a,a:m.h}))}
  return out;
}
function roundName(n){return n===2?"Final":n===4?"Semi-finals":n===8?"Quarter-finals":`Round of ${n}`}
function roundCode(n,i){return n===2?"F":n===4?"SF"+(i+1):n===8?"QF"+(i+1):"R"+n+"-"+(i+1)}

  for(let i=0;i<P;i+=2){const h=order[i],a=order[i+1];
    const m={id:uid(),stage:"ko",round:r,size:P,label:roundName(P),code:roundCode(P,i/2)};
    if(h&&a){m.h=h;m.a=a}else{m.h=h||a;m.a=null;m.bye=true}
    out.push(m);prev.push(m)}
  let size=P/2;
  while(size>=2){r++;const nxt=[];
    for(let i=0;i<prev.length;i+=2){const m={id:uid(),stage:"ko",round:r,size,label:roundName(size),code:roundCode(size,i/2),h:{m:prev[i].id},a:{m:prev[i+1].id}};out.push(m);nxt.push(m)}
    prev=nxt;size/=2}

}
function genFixtures(c){
  const ids=(c.teams||[]).map(t=>t.id);

  const ko=G===2?[{g:"A",p:1},{g:"B",p:2},{g:"B",p:1},{g:"A",p:2}]:[{g:"A",p:1},{g:"B",p:2},{g:"C",p:1},{g:"D",p:2},{g:"B",p:1},{g:"A",p:2},{g:"D",p:1},{g:"C",p:2}];
  // build KO directly in given order (already paired)

function makeTeams(group,count,method){

function autoSchedule(ev){
  const days=[];if(!ev.start)return {done:0,left:0};let d=ev.start;const end=ev.end&&ev.end>=ev.start?ev.end:ev.start;let g=0;while(d<=end&&g++<60){days.push(d);d=addDays(d,1)}

  const toMin=x=>{const [h,m]=String(x||"08:00").split(":").map(Number);return h*60+(m||0)},fmtT=v=>String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0");
  const slots=[];days.forEach(day=>{for(let t=toMin(s.dayStart||"08:00");t+maxMin<=toMin(s.dayEnd||"18:00");t+=maxMin+gap)slots.push({day,time:fmtT(t)})});

  queue.sort((x,y)=>phase(x.m)-phase(y.m)||x.m.round-y.m.round||x.ci-y.ci||x.mi-y.mi);

    for(const r of refs){if(!r)continue;
      if(r.m){const f=c.matches.find(x=>x.id===r.m);if(f&&!f.bye&&!(slotOf[f.id]!=null&&slotOf[f.id]<cur))return false}
      if(r.g){const gm=c.matches.filter(x=>x.stage==="group"&&x.group===r.g);if(gm.some(x=>!(slotOf[x.id]!=null&&slotOf[x.id]<cur)))return false}}
    return true};

    for(let qi=0;qi<queue.length&&used<P;qi++){const q=queue[qi],c=ev.cats[q.k];
      const teams=[q.m.h,q.m.a].map(r=>r&&r.t).filter(Boolean);

    si++;

}

  let h=`<div class="spread"><h2>Events</h2><button class="btn primary slim" data-act="new-event">New event</button></div>
  <p class="muted small" style="margin:-4px 0 12px">Run your annual academy competition: teams for each age group, fixtures, results, tables and awards.</p>`;
  if(!evs.length)return h+`<div class="panel empty">No events yet. Create one, for example "Academy Cup ${new Date().getFullYear()}".</div>`;
  return h+`<div class="pg-list">${evs.map(ev=>{const [st,cl]=evStatus(ev),n=evCount(ev),cats=Object.keys(ev.cats||{});
    return `<button class="evcard" data-act="open-event" data-id="${ev.id}"><span class="evcard-top"><span class="pg-when">${ev.start?fmt(ev.start,{day:"numeric",month:"short"}):""}${ev.end&&ev.end!==ev.start?" to "+fmt(ev.end,{day:"numeric",month:"short",year:"numeric"}):ev.start?" "+parseISO(ev.start).getFullYear():""}</span><span class="st ${cl}">${st}</span></span>
      <span class="pg-title">${esc(ev.name)}</span><span class="sc-meta">${cats.map(gpill).join("")}${ev.venue?`<span class="sc-loc">${PIN}${esc(ev.venue)}</span>`:""}</span>
      ${n.n?`<span class="pg-bar"><span style="width:${n.p/n.n*100}%"></span></span><span class="muted small">${n.p} of ${n.n} matches played</span>`:`<span class="muted small">Set up teams and fixtures</span>`}</button>`}).join("")}</div>`;
}
function matchCard(ev,k,m){
  const c=ev.cats[k],h=resolveRef(c,m.h),a=resolveRef(c,m.a),th=teamOf(c,h),ta=teamOf(c,a),ready=h&&a;
  if(m.bye)return `<div class="mc mc-bye"><span class="mc-meta">${esc(m.code||m.label)}</span><span>${th?teamChip(th):esc(refLabel(c,m.h))} goes through (bye)</span></div>`;
  const wid=winnerId(c,m);
  const side=(t,ref,id)=>t?`<span class="mc-team${m.played&&wid===id?" win":""}">${teamChip(t)}</span>`:`<span class="mc-team tbd">${esc(refLabel(c,ref))}</span>`;
  return `<button class="mc${m.played?" done":""}" data-act="match" data-id="${ev.id}" data-k="${esc(k)}" data-m="${m.id}"${ready?"":" aria-disabled=\"true\""}>
    <span class="mc-meta">${esc(m.stage==="ko"?(m.code==="F"?"Final":m.label):m.label)}${m.date?`, ${fmt(m.date,{weekday:"short",day:"numeric",month:"short"})}`:""}${m.time?" "+esc(m.time):""}${m.pitch?", "+esc(m.pitch):""}</span>
    <span class="mc-row">${side(th,m.h,h)}<span class="mc-score">${m.played?`${m.hs}<small>–</small>${m.as}`:"vs"}</span>${side(ta,m.a,a)}</span>
    ${m.played&&m.hp!=null&&m.hs===m.as?`<span class="mc-pens">Penalties ${m.hp}–${m.ap}</span>`:""}
    ${m.played&&(m.goals||[]).length?`<span class="mc-goals">⚽ ${goalsText(m)}</span>`:""}
    ${m.played&&m.pom&&data.players[m.pom]?`<span class="mc-goals">⭐ Player of the match: ${esc(data.players[m.pom].name)}</span>`:""}
    ${m.played&&m.by&&isAdminView()&&m.by!=="an admin"?`<span class="mc-goals">Entered by ${esc(m.by)}</span>`:""}</button>`;
}
function goalsText(m){const t={};(m.goals||[]).forEach(g=>{const n=g.p==="og"?"Own goal":(data.players[g.p]||{}).name||"Player";t[n]=(t[n]||0)+1});return esc(Object.keys(t).map(n=>t[n]>1?`${n} ×${t[n]}`:n).join(", "))}
function standingsTable(c,g){
  const st=standings(c,g);
  return `<div class="reg"><table class="lt"><thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>
  ${st.map((r,i)=>`<tr class="${g&&i<2?"qual":""}"><td><span class="pos">${i+1}</span>${teamChip(r.t)}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF-r.GA>0?"+":""}${r.GF-r.GA}</td><td><b>${r.Pts}</b></td></tr>`).join("")}</tbody></table></div>`;
}
function viewEvent(id){
  const ev=Object.assign({id},data.events[id]),cats=coachEventCats(ev),[st,cl]=evStatus(ev),adm=isAdminView()||(can("events")&&can("edit"));
  if(!cats.includes(ui.evCat))ui.evCat=cats[0]||null;
  const days=ev.start?Math.round((parseISO(ev.start)-parseISO(today()))/864e5):null;
  let h=`<button class="back" data-act="back">‹ Back</button>
  <div class="evhero"><span class="evhero-l">${st}${days>0?`, starts in ${days} day${days===1?"":"s"}`:""}</span><b>${esc(ev.name)}</b>
  <span>${ev.start?fmt(ev.start,{weekday:"short",day:"numeric",month:"long"}):""}${ev.end&&ev.end!==ev.start?" to "+fmt(ev.end,{weekday:"short",day:"numeric",month:"long"}):""}${ev.venue?", "+esc(ev.venue):""}</span></div>
  <div class="row" style="margin:12px 0 4px;gap:8px">${adm?`<button class="btn slim" data-act="edit-event" data-id="${id}">Edit event</button><button class="btn slim" data-act="ev-schedule" data-id="${id}">Auto schedule</button>`:""}<button class="btn slim" data-act="ev-share" data-id="${id}">Share update</button></div>
  ${isAdminView()?"":`<p class="muted small" style="margin:6px 0 0">You're working on ${esc(cats.join(", ")||"no categories")}.</p>`}`;
  h+=segTabs(ui.evView,"ev-view",[["comp","Competition"],["timetable","Timetable"]]);
  if(ui.evView==="timetable")return h+viewTimetable(id)+(isAdminView()||can("delete")?delBtn("del-event",id,"Delete event"):"");
  if(!cats.length)return h+`<div class="panel empty">Choose the age groups taking part. <button class="link" data-act="edit-event" data-id="${id}">Edit event</button></div>`;
  h+=`<div class="chips" role="group" aria-label="Category" style="margin-top:14px">${cats.map(k=>`<button class="chip" data-act="ev-cat" data-v="${esc(k)}" aria-pressed="${ui.evCat===k}">${esc(k)}</button>`).join("")}</div>`;
  const k=ui.evCat,c=ev.cats[k];
  const fmtName=(FORMATS.find(f=>f[0]===c.format)||FORMATS[0])[1];
  h+=`<div class="spread"><span class="muted small">${esc(fmtName)}${c.format==="league"&&c.double?", home and away":""}${c.format==="groups"?`, ${c.groups||2} groups`:""}, ${c.matchMin||20} min matches</span>${adm?`<button class="link" data-act="ev-catset" data-id="${id}">Change format</button>`:""}</div>`;
  if(!(c.teams||[]).length&&!adm)return h+`<div class="panel empty">Teams for ${esc(k)} haven't been set up yet.</div>`;
  if(!(c.teams||[]).length)return h+`<div class="evstep"><span class="step-n">1</span><span><b>Create the ${esc(k)} teams</b><span class="muted small">Split ${active().filter(p=>p.group===k).length} players into balanced teams, then adjust by hand.</span></span><button class="btn primary slim" data-act="ev-teams" data-id="${id}">Create teams</button></div>`;
  if(!(c.matches||[]).length&&adm)h+=`<div class="evstep"><span class="step-n">2</span><span><b>Generate fixtures</b><span class="muted small">${c.teams.length} teams are ready.</span></span><button class="btn primary slim" data-act="ev-fixtures" data-id="${id}">Generate</button></div>`;
  h+=segTabs(ui.evTab,"ev-tab",[["matches","Matches"],["table",c.format==="knockout"?"Bracket":"Table"],["teams","Teams"],["awards","Awards"]]);
  if(ui.evTab==="matches"){
    const ms=(c.matches||[]);if(!ms.length)return h+`<p class="muted">No fixtures yet.</p>`;
    const unsched=ms.some(m=>!m.bye&&!m.date);
    if(unsched&&adm)h+=`<p class="muted small">Some matches have no time yet. Use <b>Auto schedule</b> above, or tap a match to set it.</p>`;
    const groupsBy={};ms.forEach(m=>{const key=m.stage==="ko"?(m.code==="F"?"Final":m.label):m.stage==="group"?"Group stage, round "+m.round:m.label;(groupsBy[key]=groupsBy[key]||[]).push(m)});
    Object.keys(groupsBy).forEach(key=>{h+=`<h3>${esc(key)}</h3><div class="mc-list">${groupsBy[key].map(m=>matchCard(ev,k,m)).join("")}</div>`});
  }else if(ui.evTab==="table"){
    if(c.format==="league")h+=standingsTable(c);
    if(c.format==="groups")"ABCD".slice(0,c.groups||2).split("").forEach(g=>{h+=`<h3>Group ${g}</h3>`+standingsTable(c,g)});
    const ko=(c.matches||[]).filter(m=>m.stage==="ko");
    if(ko.length){const rounds={};ko.forEach(m=>(rounds[m.round]=rounds[m.round]||[]).push(m));
      h+=`<h3>${c.format==="groups"?"Knockout":"Bracket"}</h3><div class="bracket">${Object.keys(rounds).sort((a,b)=>a-b).map(r=>`<div class="br-col"><span class="br-h">${esc(rounds[r][0].label)}</span>${rounds[r].map(m=>matchCard(ev,k,m)).join("")}</div>`).join("")}</div>`}
    if(c.format!=="knockout")h+=`<p class="muted small">3 points for a win, 1 for a draw. Ties are split by goal difference, then goals scored.${c.format==="groups"?" The top two in each group go through.":""}</p>`;
  }else if(ui.evTab==="teams"){
    if(adm)h+=`<div class="row" style="gap:8px;margin-bottom:10px"><button class="btn slim" data-act="ev-teams" data-id="${id}">Remake teams</button><button class="btn slim" data-act="ev-fixtures" data-id="${id}">${(c.matches||[]).length?"Regenerate fixtures":"Generate fixtures"}</button></div>`;
    h+=`<div class="teams">${c.teams.map(t=>`<${adm?"button":"div"} class="teamcard"${adm?` data-act="ev-team" data-id="${id}" data-t="${t.id}"`:""} style="--tc:${t.color}"><span class="teamcard-h">${teamChip(t,true)}${t.group?`<span class="tag">Group ${t.group}</span>`:""}</span>
      <span class="teamcard-p">${(t.players||[]).map(pid=>{const p=data.players[pid];return p?`<span>${esc(p.name)}${p.position==="Goalkeeper"?" (GK)":""}${t.captain===pid?" (C)":""}</span>`:""}).join("")||'<span class="muted">No players</span>'}</span>
      <span class="muted small">${(t.players||[]).length} players.${adm?" Tap to edit.":""}</span></${adm?"button":"div"}>`).join("")}</div>`;
    const unplaced=active().filter(p=>p.group===k&&!teamOfPlayer(c,p.id));
    if(unplaced.length&&adm)h+=`<div class="banner"><b>Not in a team:</b> ${esc(unplaced.map(p=>p.name).join(", "))}. Tap a team to add them.</div>`;
  }else{
    const ch=champion(c),sc=scorers(c),a=c.awards||{};
    const pn=pid=>pid&&data.players[pid]?esc(data.players[pid].name):"";
    h+=`<div class="awards">
      <div class="aw aw-gold"><span>🏆 Champions</span><b>${ch?teamChip(teamOf(c,ch.w),true):"To be decided"}</b></div>
      <div class="aw"><span>🥈 Runners-up</span><b>${ch&&ch.r?teamChip(teamOf(c,ch.r)):"To be decided"}</b></div>
      <div class="aw"><span>⚽ Top scorer</span><b>${sc[0]?`${pn(sc[0].p)} <small>${sc[0].n} goal${sc[0].n===1?"":"s"}</small>`:"No goals yet"}</b></div>
      <div class="aw"><span>⭐ Best player</span><b>${pn(a.best)||'<span class="muted">Not chosen</span>'}</b></div>
      <div class="aw"><span>🧤 Best goalkeeper</span><b>${pn(a.gk)||'<span class="muted">Not chosen</span>'}</b></div>
      <div class="aw"><span>🤝 Fair play</span><b>${a.fair?(teamOf(c,a.fair)?teamChip(teamOf(c,a.fair)):pn(a.fair)):'<span class="muted">Not chosen</span>'}</b></div></div>
      <div class="row" style="gap:8px;margin-top:12px">${adm?`<button class="btn primary slim" data-act="ev-awards" data-id="${id}">Choose awards</button>`:""}<button class="btn slim" data-act="ev-share-awards" data-id="${id}">Share awards</button></div>`;
    if(sc.length)h+=`<h3>Scorers</h3><div class="list">${sc.slice(0,15).map((r,i)=>{const t=teamOfPlayer(c,r.p);return `<div class="item spread"><span><span class="pos">${i+1}</span>${pn(r.p)} ${t?`<span class="muted small">${esc(t.name)}</span>`:""}</span><b>${r.n}</b></div>`}).join("")}</div>`;
  }
  return h+(isAdminView()||can("delete")?delBtn("del-event",id,"Delete event"):"");
}

/* forms */

  const ev=id?data.events[id]:{name:"Academy Cup "+new Date().getFullYear(),start:today(),end:today(),venue:"",cats:{},sched:{dayStart:"08:00",dayEnd:"18:00",gap:5,pitches:1}};

  <label class="f">Notes<textarea name="notes" placeholder="Rules, prizes, contacts">${esc(ev.notes)}</textarea></label>`+actions(id?"Save changes":"Create event"),fd=>{
    const name=txt(fd,"name");if(!name)return false;

    const chosen=fd.getAll("cats");const cats={};
    chosen.forEach(g=>{const n=active().filter(p=>p.group===g).length;cats[g]=(e.cats||{})[g]||{format:n>=1&&Math.ceil(n/7)>=5?"groups":"league",double:false,groups:2,matchMin:STAGE_MIN(g),teams:[],matches:[],awards:{}}});
    Object.assign(e,{name,start:fd.get("start"),end:fd.get("end")||fd.get("start"),venue:txt(fd,"venue"),notes:txt(fd,"notes"),cats,
      sched:{dayStart:fd.get("dayStart")||"08:00",dayEnd:fd.get("dayEnd")||"18:00",gap:Number(fd.get("gap"))||0,pitches:Math.max(1,Number(fd.get("pitches"))||1)}});
    const eid=id||uid();saveEvent(eid,e);if(!id){ui.evCat=chosen[0]||null;ui.evTab="matches";go({type:"event",id:eid})}
    toast(id?"Event saved":"Event created");

function STAGE_MIN(g){const n=parseInt(String(g).replace(/\D/g,""),10);if(!n)return 30;return n<=8?15:n<=10?20:n<=12?25:n<=14?30:40}

    case "week":{const n=Number(b.dataset.n);ui.week=n?addDays(ui.week,n):weekStart(today());render();break}
    case "regmonth":ui.regMonth=addMonths(ui.regMonth,Number(b.dataset.n));render();break;
    case "export":exportCSV();break;
    case "more":ui.pastLimit+=20;render();break;
    case "reason":{const inp=$("#noteIn");if(inp){inp.value=b.dataset.r;inp.focus()}break}
    case "att":{const s=getSession(b.dataset.sid);const cur=(s.attendance||{})[b.dataset.pid];setAtt(b.dataset.sid,b.dataset.pid,cur===b.dataset.st?null:b.dataset.st);break}
    case "att-note":noteForm(b.dataset.sid,b.dataset.pid);break;
    case "all-present":mutateSession(id,s=>{s.attendance=Object.assign({},s.attendance);eligible(s).forEach(p=>{if(!s.attendance[p.id])s.attendance[p.id]="present"})},300);break;
    case "restore":{const s=getSession(id);if(s&&s.scheduleId){setSkip(s.scheduleId,s.date,false);toast("Practice restored")}break}
    case "cancel-occ":{const s=getSession(id);confirmSheet("Cancel this practice?",(s.virtual?"":"Any attendance taken will be removed. ")+"Use this for holidays or bad weather. Other weeks stay on the schedule.","Cancel practice",()=>{
      if(!s.virtual)remove("sessions",id);setSkip(s.scheduleId,s.date,true);toast("Practice cancelled")});break}
    case "del-session":confirmSheet("Delete session?","Its attendance record will be removed too. This can't be undone.","Delete session",()=>{remove("sessions",id);go(null);toast("Session deleted")});break;
    case "del-schedule":sheet.close();setTimeout(()=>confirmSheet("Delete weekly practice?","Future practices from it will disappear. Sessions where you already took attendance are kept.","Delete",()=>{remove("schedules",id);toast("Weekly practice deleted")}),50);break;
    case "del-player":confirmSheet("Delete player?","Their assessments, charges and payment records will be deleted. To keep their history, edit the player and untick Active instead.","Delete player",()=>{
      ["payments","charges"].forEach(c=>Object.keys(data[c]).filter(k=>data[c][k].playerId===id).forEach(k=>remove(c,k)));
      Object.keys(data.assessments).filter(k=>data.assessments[k].playerId===id).forEach(k=>remove("assessments",k));remove("players",id);go(null);toast("Player deleted")});break;
    case "pay":paymentForm(id);break;
    case "coach-att":{const sid=b.dataset.sid,cid=b.dataset.cid,st=b.dataset.st;const cur=((getSession(sid)||{}).coachAtt||{})[cid];
      mutateSession(sid,x=>{x.coachAtt=Object.assign({},x.coachAtt);if(cur===st)delete x.coachAtt[cid];else x.coachAtt[cid]=st},400);break}
    case "coach-att-note":{const sid=b.dataset.sid,cid=b.dataset.cid,c=cdoc(cid),cur=((getSession(sid)||{}).coachAttNotes||{})[cid]||"";
      openSheet(`<h2>Note for ${esc(c.name)}</h2><label class="f">Reason or note<input name="note" maxlength="120" value="${esc(cur)}" placeholder="e.g. Sick, covered by another coach"></label>`+actions("Save note"),fd=>{
        const n=txt(fd,"note");mutateSession(sid,x=>{x.coachAttNotes=Object.assign({},x.coachAttNotes);if(n)x.coachAttNotes[cid]=n;else delete x.coachAttNotes[cid]},200)});break}
    case "people":ui.people=b.dataset.v;render();break;
    case "money":ui.money=b.dataset.v;render();break;
    case "go-salaries":ui.tab="fees";ui.money="salaries";go(null);break;
    case "go-coaches":ui.tab="squad";ui.people="coaches";go(null);break;
    case "new-coach":coachForm();break;
    case "edit-coach":coachForm(id);break;
    case "open-coach":go({type:"coach",id});break;
    case "group-squad":ui.tab="squad";ui.people="players";ui.group=b.dataset.g;go(null);break;
    case "pay-salary":salaryForm(id);break;
    case "salmonth":{const n=Number(b.dataset.n);ui.salMonth=n?addMonths(ui.salMonth,n):curMonth();render();break}
    case "sal-slip":salarySlip(id);break;
    case "sal-export":exportPayroll();break;
    case "sal-share":if(salSlip&&salSlip.blob){shareSlip={text:salSlip.text,blob:salSlip.blob,fname:salSlip.fname};shareSlipImage()}break;
    case "sal-save":if(salSlip&&salSlip.blob){shareSlip={text:salSlip.text,blob:salSlip.blob,fname:salSlip.fname};saveSlipImage()}break;
    case "sal-copy":if(salSlip){shareSlip={text:salSlip.text};copySlipText()}break;
    case "sess-coach":{const s=getSession(b.dataset.sid);const ids=sessionCoachIds(s).slice();const i=ids.indexOf(b.dataset.cid);i>=0?ids.splice(i,1):ids.push(b.dataset.cid);
      mutateSession(b.dataset.sid,x=>{x.coachIds=ids},400);break}
    case "del-sal":sheet.close();setTimeout(()=>confirmSheet("Delete salary payment?","It will show as unpaid again.","Delete payment",()=>{remove("salaries",id);toast("Salary payment deleted")}),50);break;
    case "del-coach":confirmSheet("Delete coach?","Their salary records will be deleted too. To keep the history, edit the coach and untick Currently coaching instead.","Delete coach",()=>{
      Object.keys(data.salaries).filter(k=>data.salaries[k].coachId===id).forEach(k=>remove("salaries",k));remove("coaches",id);go(null);toast("Coach deleted")});break;
    case "import":importSheet();break;
    case "imp-template":downloadTemplate(false);break;
    case "export-players":downloadTemplate(true);break;
    case "charge":chargeForm(id);break;
    case "fee-settings":feeSettingsForm();break;
    case "feemonth":{const n=Number(b.dataset.n);ui.feeMonth=n?addMonths(ui.feeMonth,n):curMonth();render();break}
    case "feefilter":ui.feeFilter=b.dataset.f;render();break;
    case "fee-export":exportFees();break;
    case "receipt":receiptSheet(id);break;
    case "share-slip":shareSlipImage();break;
    case "save-slip":saveSlipImage();break;
    case "copy-slip":copySlipText();break;
    case "remind":reminderSheet(id);break;
    case "del-pay":sheet.close();setTimeout(()=>confirmSheet("Delete payment?","The amount will be added back to what this player owes.","Delete payment",()=>{remove("payments",id);toast("Payment deleted")}),50);break;
    case "del-charge":confirmSheet("Remove charge?","Payments made towards it become general credit.","Remove charge",()=>{remove("charges",id);toast("Charge removed")});break;
    case "del-assess":sheet.close();setTimeout(()=>confirmSheet("Delete assessment?","This can't be undone.","Delete",()=>{remove("assessments",id);toast("Assessment deleted")}),50);break;
  }
});
document.addEventListener("change",e=>{if(e.target.id==="seasonSel"&&isAdminView()){settings=Object.assign({},settings,{seasonStart:Number(e.target.value)});saveSettings();toast("Season start saved")}});
document.addEventListener("input",e=>{if(e.target.id==="search"){ui.q=e.target.value;const l=$("#squadList");if(l)l.innerHTML=squadList()}});

let toastT=null;
function toast(m){const t=$("#toast");const host=sheet.open?sheet:document.body;if(t.parentNode!==host)host.appendChild(t);t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}

init();
})();
</script>
</body>
</html>
